name: Build Biblia Reels
on:
  push:
    paths:
      - "biblia-reels/**"
      - ".github/workflows/biblia-reels.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verifică datele
        run: python3 biblia-reels/factory/test_factory.py
      - name: Build IPA
        run: bash biblia-reels/scripts/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BibliaReels-ipa
          path: BibliaReels.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: biblia-reels-v1.${{ github.run_number }}
          name: Biblia Reels v1.${{ github.run_number }}
          make_latest: false
          files: BibliaReels.ipa
